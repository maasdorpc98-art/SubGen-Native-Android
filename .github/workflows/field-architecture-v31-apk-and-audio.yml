name: SubGen Field Architecture V3.1 Corrected APK and Audio
on:
  workflow_dispatch:
  push:
    branches: [feature/subgen-field-architecture-v31-direct-20261107]
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preserve all original audio sections
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-studio-parity.py
          python3 scripts/check-neuromodulation.py
      - name: Audit active field source for outdated fantasy framing
        run: |
          if grep -inE 'fictional|fantasy|hypothetical|imaginative|symbolic association' \
            app/src/main/java/com/subgen/nativeapp/{FieldArchitecture.kt,FieldDynamics.kt,MorphicFieldV3.kt} ; then
            echo 'Outdated field construction framing detected' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/java/com/subgen/nativeapp/MainActivity.kt').read_text()
          m=a[a.index('    private fun buildMorphic(){'):a.index('    private fun buildNeuro(){')]
          assert 'FIELD ARCHITECTURE · V3.1' in m
          assert not any(x in m.lower() for x in ['fictional', 'fantasy', 'hypothetical', 'not evidence', 'not proof'])
          assert 'plan.dynamics.finalEnergy' in m
          print('PASS: direct-language field architecture UI')
          PY
      - name: Compile and test attractor architecture and exact WAV decode
        run: |
          K=app/src/main/java/com/subgen/nativeapp
          kotlinc "$K/ScriptParser.kt" "$K/WordPacing.kt" "$K/WavIO.kt" "$K/MorphicFieldV2.kt" \
            "$K/FieldDynamics.kt" "$K/FieldArchitecture.kt" "$K/MorphicFieldV3.kt" \
            scripts/test_field_architecture_v3.kt tests/stubs/*.kt \
            -include-runtime -d /tmp/subgen-v31-tests.jar
          java -Xmx3g -jar /tmp/subgen-v31-tests.jar
      - name: Prepare native arm64 runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
          bash scripts/check-runtime.sh
      - name: Build four-section Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify identity signature and frequency creator
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.subgen.nativeapp.fourblocks.preview.fieldarchv31'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Field-Architecture-V31-Corrected-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compile official field-audio generator with new attractor dynamics
        run: |
          K=app/src/main/java/com/subgen/nativeapp
          kotlinc "$K/ScriptParser.kt" "$K/WordPacing.kt" "$K/WavIO.kt" "$K/MorphicFieldV2.kt" \
            "$K/FieldDynamics.kt" "$K/FieldArchitecture.kt" "$K/MorphicFieldV3.kt" \
            scripts/generate_affirmation_intelligence_audio.kt tests/stubs/*.kt \
            -include-runtime -d /tmp/subgen-v31-audio.jar
      - name: Generate and verify updated 36-affirmation field recording
        run: java -Xmx3g -jar /tmp/subgen-v31-audio.jar
      - name: Upload rendered recording and complete field specification
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Field-Architecture-V31-Affirmation-Intelligence-WAV
          path: test-results/affirmation-intelligence-field-direct/
          if-no-files-found: error
          compression-level: 1
