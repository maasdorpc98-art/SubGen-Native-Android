name: Generate Affirmation Intelligence Field WAV - Direct Instructions
on:
  workflow_dispatch:
  push:
    branches: [feature/affirmation-intelligence-field-direct-20261107]
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact Field Architecture V3 implementation
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile original SubGen V3 audio engine
        run: |
          K=app/src/main/java/com/subgen/nativeapp
          kotlinc "$K/ScriptParser.kt" "$K/WordPacing.kt" "$K/WavIO.kt" "$K/MorphicFieldV2.kt" "$K/FieldArchitecture.kt" "$K/MorphicFieldV3.kt" scripts/generate_affirmation_intelligence_audio.kt tests/stubs/*.kt -include-runtime -d /tmp/subgen-affirmation-intelligence-v3.jar
      - name: Generate real WAV and independently verify complete seven-node architecture
        run: |
          java -Xmx3g -jar /tmp/subgen-affirmation-intelligence-v3.jar
          test -s test-results/affirmation-intelligence-field-direct/SubGen_Affirmation_Intelligence_Field_Architecture_V3_Recreated.wav
          sha256sum test-results/affirmation-intelligence-field-direct/SubGen_Affirmation_Intelligence_Field_Architecture_V3_Recreated.wav
          cat test-results/affirmation-intelligence-field-direct/Verification_Report.txt
      - name: Confirm no fictional framing in encoded field documents
        run: |
          if grep -Eiq 'fictional|fantasy|hypothetical|imaginative' test-results/affirmation-intelligence-field-direct/{Field_Objective.txt,Field_Instructions.txt,Seven_Node_Field_Architecture.txt}; then
            echo 'Unexpected fictional framing in field documents' >&2
            exit 1
          fi
          grep -q '36 (I=12, My=12, You/Your=12)' test-results/affirmation-intelligence-field-direct/Verification_Report.txt
      - name: Upload final WAV and full architecture package
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Affirmation-Intelligence-Field-V3-Direct-Instructions
          path: test-results/affirmation-intelligence-field-direct/
          if-no-files-found: error
          compression-level: 2
