name: Field Architecture V3 APK
on:
  workflow_dispatch:
  push:
    branches: [feature/subgen-field-architecture-v3-20261107]
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check unchanged Studio and Frequency Creator
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-studio-parity.py
          python3 scripts/check-neuromodulation.py
      - name: Test seven-node architecture and exact-waveform recovery
        run: |
          K=app/src/main/java/com/subgen/nativeapp
          kotlinc "$K/ScriptParser.kt" "$K/WordPacing.kt" "$K/WavIO.kt" "$K/MorphicFieldV2.kt" "$K/FieldArchitecture.kt" "$K/MorphicFieldV3.kt" scripts/test_field_architecture_v3.kt tests/stubs/*.kt -include-runtime -d /tmp/subgen-architecture-v3.jar
          java -Xmx2g -jar /tmp/subgen-architecture-v3.jar
      - name: Prepare arm64 native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
          bash scripts/check-runtime.sh
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify signature, package and audio runtime
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.subgen.nativeapp.fourblocks.preview.fieldarchv3'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload installable V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Field-Architecture-V3-Four-Blocks
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
