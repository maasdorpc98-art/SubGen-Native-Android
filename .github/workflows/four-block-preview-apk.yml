name: Four-Block Preview APK
on:
  workflow_dispatch:
  push:
    branches: [feature/subgen-v327-four-blocks-morphic]
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preserve existing Frequency Creator and Studio UI
        run: |
          python3 scripts/check-studio-parity.py
          python3 scripts/check-neuromodulation.py
      - name: Prepare native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
          bash scripts/check-runtime.sh
      - name: Compile corrected native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and unique identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.subgen.nativeapp.fourblocks.preview.hypertest'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload four-block APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-v3.2.7-Four-Blocks-Frequency-Morphic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
