name: Field Lab v2 APK
on:
  workflow_dispatch:
  push:
    branches: [feature/morphic-field-lab-v2-20261105]
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify original Studio, NeuroMod and native source
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-studio-parity.py
          python3 scripts/check-neuromodulation.py
      - name: Verify field audio codec - real encoded WAV round-trip
        run: |
          K=app/src/main/java/com/subgen/nativeapp
          kotlinc "$K/ScriptParser.kt" "$K/WordPacing.kt" "$K/WavIO.kt" "$K/MorphicFieldV2.kt" scripts/test_morphic_v2.kt tests/stubs/*.kt -include-runtime -d /tmp/subgen-fieldlab-v2-test.jar
          java -Xmx2g -jar /tmp/subgen-fieldlab-v2-test.jar
      - name: Prepare native audio engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
          bash scripts/check-runtime.sh
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify installable APK signature and app identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.subgen.nativeapp.fourblocks.preview.fieldlabv2'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Field-Lab-v2-Four-Blocks-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
