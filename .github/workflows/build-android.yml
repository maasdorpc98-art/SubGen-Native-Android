name: Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, subgen-v3.0.1-diagnostic-apk, subgen-v3.0.2-stability, subgen-v3.0.3-jni-stability]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Required Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Core parser and audio verification
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-studio-parity.py
          python3 scripts/check-diagnostics.py
          python3 scripts/check-stability.py
          python3 scripts/check-jni-stability.py
          bash scripts/run-core-tests.sh
      - name: Native sherpa-onnx runtime and Kotlin JNI bridge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
      - name: Validate native Android runtime files
        run: |
          bash scripts/check-runtime.sh
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android APK signature and arm64 runtime
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Native-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create exact source snapshot from this commit
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/SubGen-Native-v3.0.3-JNI-Stability-Source.zip"
      - name: Upload matching source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Native-v3.0.3-JNI-Stability-Source
          path: ${{ runner.temp }}/SubGen-Native-v3.0.2-Stability-Source.zip
          if-no-files-found: error
      - name: Publish installable diagnostic APK pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/subgen-v3.0.3-jni-stability'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v3.0.3-jni-stability-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title 'Sub Gen Native v3.0.3 JNI Stability Test' \
              --notes 'Native Kotlin Kokoro uses non-callback JNI generation to avoid documented SIGABRT problem, preserving bounded checkpoint rendering, original UI and crash diagnostics. Device validation required.' \
              --prerelease --target "$GITHUB_SHA"
          fi
