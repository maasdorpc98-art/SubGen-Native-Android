name: Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, subgen-v3.0.1-diagnostic-apk, subgen-v3.0.2-stability, subgen-v3.0.3-jni-stability, subgen-v3.0.4-fp32-audio-stability, subgen-v3.0.5-speed-engine, subgen-v3.0.6-hypnosis-essential-controls, subgen-v3.0.7-adaptive-neural-speed, subgen-v3.0.8-voice-speed-updates, subgen-v3.1.1-script-acoustic-contract, subgen-v3.1.2-neuromodulation-a, subgen-v3.1.3-neuromodulation-full-ab, subgen-v3.2-hyper-production]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Required Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Core parser and audio verification
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-studio-parity.py
          python3 scripts/check-diagnostics.py
          python3 scripts/check-stability.py
          python3 scripts/check-jni-stability.py
          python3 scripts/check-fp32-stability.py
          python3 scripts/check-speed-engine.py
          python3 scripts/check-hypnosis-essentials.py
          python3 scripts/check-adaptive-speed.py
          python3 scripts/check-voice-updates.py
          python3 scripts/check-script-acoustic-contract.py
          python3 scripts/check-neuromodulation.py
          bash scripts/run-core-tests.sh
          bash scripts/run-hyper-tests.sh
          bash scripts/run-hq-tests.sh
      - name: Upload HYPER test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-v3.2.2-test-evidence
          path: test-results/
      - name: Native sherpa-onnx runtime and Kotlin JNI bridge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 file
          bash scripts/prepare-native-runtime.sh
      - name: Validate native Android runtime files
        run: |
          bash scripts/check-runtime.sh
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android APK signature and arm64 runtime
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee test-results/DEBUG-APK-SIGNATURE.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > test-results/DEBUG-APK-IDENTITY.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Native-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # This APK is deliberately unsigned: a reusable private signing key is kept
      # OUTSIDE this public repository and never sent to GitHub Actions.
      - name: Build unsigned stable-release candidate
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package offline signing kit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/subgen-offline-signing"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/subgen-offline-signing/SubGen-v3.2.2-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/subgen-offline-signing/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/subgen-offline-signing/zipalign"
          chmod +x "$RUNNER_TEMP/subgen-offline-signing/zipalign"
          cp test-results/DEBUG-APK-SIGNATURE.txt test-results/DEBUG-APK-IDENTITY.txt "$RUNNER_TEMP/subgen-offline-signing/"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/subgen-offline-signing/UNSIGNED-STABLE-APK-IDENTITY.txt"
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/subgen-offline-signing/BUILD-SHA256.txt"
          test -s "$RUNNER_TEMP/subgen-offline-signing/SubGen-v3.2.2-unsigned.apk"
      - name: Upload unsigned APK and offline signing tools
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-v3.2.2-Unsigned-Stable-Signing-Kit
          path: ${{ runner.temp }}/subgen-offline-signing/
          if-no-files-found: error

      - name: Create exact source snapshot from this commit
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/SubGen-Native-v3.2.2-HYPER-Source.zip"
      - name: Upload matching source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SubGen-Native-v3.2.2-HYPER-Source
          path: ${{ runner.temp }}/SubGen-Native-v3.2.2-HYPER-Source.zip
          if-no-files-found: error
      - name: Publish installable diagnostic APK pre-release
        if: github.event_name == 'push' && false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v3.0.7-adaptive-speed-test'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title 'Sub Gen Native v3.0.7 Adaptive Neural Speed Test' \
              --notes 'Keeps essential native Hypnosis UI and FP32 Kokoro quality. Adds device-calibrated native 2/4-thread inference for long uncached renders, 1/2/4 warmup benchmark, better thermal fallback and real RTF/ETA telemetry. No device-speed claims until measured.' \
              --prerelease --target "$GITHUB_SHA"
          fi